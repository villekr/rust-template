# cargo-deny configuration.
# Docs: https://embarkstudios.github.io/cargo-deny/
# Run locally with: cargo deny check

[advisories]
# Deny crates with known security vulnerabilities (RustSec advisory DB).
version = 2
yanked = "deny"

[bans]
# Warn on multiple versions of the same crate (dependency bloat / drift).
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Allow a permissive set of licenses common in the Rust ecosystem.
# Add project-specific licenses here as dependencies are introduced.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[sources]
# Only allow crates from the official crates.io registry by default.
unknown-registry = "deny"
unknown-git = "deny"
